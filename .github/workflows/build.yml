name: Build

on:
  push:
    # ドキュメントだけの変更では Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    branches:
      - '**'
  pull_request:
    # ドキュメントだけの変更では Build を実行しない
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# どのジョブもリポジトリを読むだけ。GITHUB_TOKEN に書き込み権限を渡さない
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 外部のアクションは tag ではなくコミット SHA で固定する（tag は付け替えられる）。
# 更新は .github/dependabot.yml が SHA とコメントの版をそろえて PR にする
jobs:
  build:
    name: ${{ github.ref_name }}
    # 同じリポジトリのブランチは push で実行済みなので、PR では Fork からのものだけ実行する
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle デーモンは gradle/gradle-daemon-jvm.properties の toolchain（25）で動くので、同じ版を入れておく
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # gradle/gradle-wrapper.jar のチェックサム検証も、この action が既定で行う
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # 1 回の起動にまとめて、構成の読み込みを 1 回で済ませる（タスクは設定キャッシュの下で並列に走る）。
      # setup-gradle のキャッシュはジョブごとに分かれるので、--build-cache で再利用できるのは同じジョブの前回の出力
      - name: Build and lint
        run: ./gradlew assembleDebug ktlintCheck lintDebug --build-cache --continue

  # ビルドの成果物は使わないので、ビルド・リントと並列で実行する
  test:
    name: ${{ github.ref_name }} (test)
    # 同じリポジトリのブランチは push で実行済みなので、PR では Fork からのものだけ実行する
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle デーモンは gradle/gradle-daemon-jvm.properties の toolchain（25）で動くので、同じ版を入れておく
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test
        run: ./gradlew test --build-cache --continue
