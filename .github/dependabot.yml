version: 2

updates:
  # ワークフローの uses は SHA で固定しているので、更新はここで SHA ごと PR にする。
  # Gradle の依存は Kotlin 2.2 が読める版に縛っている（docs/architecture.md）ため、自動更新の対象にしない
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開から日が浅い版は取り込まない（乗っ取られた版が取り下げられるまでの時間を稼ぐ）
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - '*'
